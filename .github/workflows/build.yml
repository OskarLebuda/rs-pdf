name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── Build native binary for each platform ──────────────────────────────────
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest

          - target: x86_64-apple-darwin
            runner: macos-latest

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install fontconfig (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm exec napi build --platform --release --output-dir dist --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'

      - uses: actions/upload-artifact@v4
        with:
          name: rs-pdf-${{ matrix.target }}
          path: dist/rs-pdf.*.node
          if-no-files-found: error

  # ─── Publish ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create GitHub Release
      id-token: write # npm provenance (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --no-frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: rs-pdf-*
          path: dist
          merge-multiple: true

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Populate platform npm packages
        run: |
          cp dist/rs-pdf.darwin-arm64.node    npm/darwin-arm64/
          cp dist/rs-pdf.darwin-x64.node      npm/darwin-x64/
          cp dist/rs-pdf.linux-x64-gnu.node   npm/linux-x64-gnu/
          cp dist/rs-pdf.linux-arm64-gnu.node npm/linux-arm64-gnu/
          cp dist/rs-pdf.win32-x64-msvc.node  npm/win32-x64-msvc/

      - name: Generate changelog & create GitHub Release
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish platform packages
        run: |
          for pkg in npm/*/; do
            pnpm publish "$pkg" --provenance --access public --no-git-checks
          done

      - name: Publish main package
        run: pnpm publish --provenance --access public --no-git-checks
